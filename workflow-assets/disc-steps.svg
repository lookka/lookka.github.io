<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="white"/><text x="45" y="55" font-family="sans-serif" font-size="31" fill="#222">A tilted disc, made from simple 2D shapes</text><text x="45" y="88" font-family="sans-serif" font-size="18" fill="#222">No 3D tool needed: ellipse, duplicate, a side contour, then rotate the group.</text><text x="30" y="160" font-family="sans-serif" font-size="17" fill="#222">1 · Draw a wide ellipse</text><g transform="translate(150 280)"><ellipse cx="0" cy="-12" rx="105" ry="36" fill="white" stroke="#111" stroke-width="1.8"/></g><text x="30" y="385" font-family="sans-serif" font-size="15" fill="#222">E → drag a flattened ellipse</text><text x="30" y="415" font-family="sans-serif" font-size="15" fill="#222">Choose white fill, black outline</text><text x="330" y="160" font-family="sans-serif" font-size="17" fill="#222">2 · Duplicate and move down</text><g transform="translate(450 280)"><ellipse cx="0" cy="12" rx="105" ry="36" fill="white" stroke="#999" stroke-width="1.8"/><ellipse cx="0" cy="-12" rx="105" ry="36" fill="white" stroke="#111" stroke-width="1.8"/></g><text x="330" y="385" font-family="sans-serif" font-size="15" fill="#222">Ctrl+D → move vertically</text><text x="330" y="415" font-family="sans-serif" font-size="15" fill="#222">Small offset = thin disc</text><text x="630" y="160" font-family="sans-serif" font-size="17" fill="#222">3 · Close the side contour</text><g transform="translate(750 280)"><path d="M -105,-12 L -105,12 A 105,36 0 0 0 105,12 L 105,-12 A 105,36 0 0 1 -105,-12 Z" fill="#e7e7e7" stroke="#111" stroke-width="1.8"/><ellipse cx="0" cy="-12" rx="105" ry="36" fill="white" stroke="#111" stroke-width="1.8"/></g><text x="630" y="385" font-family="sans-serif" font-size="15" fill="#222">B draws the two side edges</text><text x="630" y="415" font-family="sans-serif" font-size="15" fill="#222">F2 curves the front bottom edge</text><text x="930" y="160" font-family="sans-serif" font-size="17" fill="#222">4 · Group and rotate</text><g transform="translate(1050 280) rotate(-18)"><path d="M -105,-12 L -105,12 A 105,36 0 0 0 105,12 L 105,-12 A 105,36 0 0 1 -105,-12 Z" fill="#e7e7e7" stroke="#111" stroke-width="1.8"/><ellipse cx="0" cy="-12" rx="105" ry="36" fill="white" stroke="#111" stroke-width="1.8"/></g><text x="930" y="385" font-family="sans-serif" font-size="15" fill="#222">Select parts → Ctrl+G</text><text x="930" y="415" font-family="sans-serif" font-size="15" fill="#222">Click again → rotation handles</text><text x="45" y="500" font-family="sans-serif" font-size="19" fill="#222">Fastest after the first one: keep a master disc, duplicate it with Ctrl+D, then scale and rotate.</text><text x="45" y="538" font-family="sans-serif" font-size="18" fill="#222">The reusable SVG has two editable parts: the top ellipse and a closed side path.</text></svg>